name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push on the same branch makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `check:auth` compares a RUNNING dev server with the next build, so it
      # belongs to local/smoke checks (scripts/browser-smoke.mjs), not CI.

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
